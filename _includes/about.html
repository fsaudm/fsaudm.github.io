<div class="section" id="about">
  <div class="about">
    {% if site.about_profile_image %}
    <img src="{{ site.about_profile_image | relative_url }}" alt="{{ site.name }}" class="about-photo">
    {% endif %}
    <div class="about-text">
      <h1 class="about-name">{{ site.name }}</h1>
      <p class="about-title">{{ site.title }}</p>
      {{ site.about_content | markdownify }}
    </div>
  </div>
</div>

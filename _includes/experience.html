<div class="section" id="experience">
  <div class="section-label">Experience</div>
  {% for exp in site.data.experience %}
  <div class="card">
    <div class="entry">
      <div class="entry-header">
        <span class="entry-company">
          {% if exp.link %}<a href="{{ exp.link }}" target="_blank">{{ exp.company }}</a>{% else %}{{ exp.company }}{% endif %}
        </span>
        <span class="entry-dates">{{ exp.dates }}</span>
      </div>
      <div class="entry-description">{{ exp.description | markdownify }}</div>
    </div>
  </div>
  {% endfor %}
</div>

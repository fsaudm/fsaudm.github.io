<header class="site-header">
  <span class="site-name">{{ site.name }}</span>
  <nav class="site-nav no-print">
    <div class="social-links">
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank">github</a>{% endif %}
      {% if site.linkedin_username %}<a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank">linkedin</a>{% endif %}
      {% if site.email %}<a href="mailto:{{ site.email }}">email</a>{% endif %}
    </div>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
  </nav>
</header>

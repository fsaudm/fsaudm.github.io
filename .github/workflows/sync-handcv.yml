name: Sync HandCV

on:
  repository_dispatch:
    types: [sync-handcv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout HandCV
        uses: actions/checkout@v4
        with:
          repository: fsaudm/HandCV
          path: _handcv
          ref: master

      - name: Sync handcv/ directory
        run: |
          rm -rf handcv/
          cp -r _handcv/dial handcv
          cp -r _handcv/resume handcv/resume

          # Fix resume path for deployed version
          sed -i "s|\.\./resume/|resume/|g" handcv/app.js

          # Rename .md to .txt so Jekyll doesn't process them
          for f in handcv/resume/*.md; do
            mv "$f" "${f%.md}.txt"
          done
          # Update index.json to reference .txt
          sed -i 's/\.md/\.txt/g' handcv/resume/index.json
          # Update app.js comment
          sed -i 's/resume\/\*\.md/resume\/*.txt/g' handcv/app.js

          rm -rf _handcv

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet handcv/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handcv/
          git commit -m "sync: update HandCV from fsaudm/HandCV"
          git push

name: Sync HandCV

on:
  repository_dispatch:
    types: [sync-handcv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout HandCV
        uses: actions/checkout@v4
        with:
          repository: fsaudm/HandCV
          path: _handcv
          ref: master

      - name: Sync handcv/ directory
        run: |
          rm -rf handcv/
          cp -r _handcv/dial handcv

          # Compile resume/*.md + index.json into a single sections.json
          python3 -c "
          import json, os
          idx = json.load(open('_handcv/resume/index.json'))
          sections = []
          for f in idx:
              text = open('_handcv/resume/' + f).read()
              parts = text.split('---')
              fm = {}
              for line in parts[1].strip().split(chr(10)):
                  kv = line.split(':', 1)
                  if len(kv) == 2:
                      fm[kv[0].strip()] = kv[1].strip()
              body = '---'.join(parts[2:]).strip() if len(parts) > 2 else ''
              sections.append({'title': fm.get('title', ''), 'body': body})
          json.dump(sections, open('handcv/sections.json', 'w'), indent=2)
          "

          # Replace the .md loader in app.js with a simple JSON fetch
          python3 -c "
          import re
          code = open('handcv/app.js').read()
          old = re.search(r'// ── Resume data.*?sections = C\.FALLBACK_SECTIONS;\s*\}', code, re.DOTALL)
          if old:
              new_loader = '''// ── Resume data ──
    var sections;
    try {
      var resp = await fetch('sections.json');
      sections = await resp.json();
    } catch(e) {
      sections = C.FALLBACK_SECTIONS;
    }'''
              code = code[:old.start()] + new_loader + code[old.end():]
          open('handcv/app.js', 'w').write(code)
          "

          rm -rf _handcv

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet handcv/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handcv/
          git commit -m "sync: update HandCV from fsaudm/HandCV"
          git push

name: Sync HandCV

on:
  repository_dispatch:
    types: [sync-handcv]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout HandCV
        uses: actions/checkout@v4
        with:
          repository: fsaudm/HandCV
          path: _handcv
          ref: master

      - name: Sync handcv/ directory
        run: |
          rm -rf handcv/
          cp -r _handcv/dial handcv
          cp -r _handcv/resume handcv/resume
          sed -i "s|\.\./resume/|resume/|g" handcv/app.js
          rm -rf _handcv

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet handcv/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handcv/
          git commit -m "sync: update HandCV from fsaudm/HandCV"
          git push

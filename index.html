<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farid Saud</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0F0F14; color: #e0e0e0; font-family: 'Roboto', sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }

    h1 { font-weight: 300; font-size: 2.4rem; letter-spacing: 0.08em; color: #fff; margin-bottom: 0.4rem; }
    .tagline { font-weight: 300; font-size: 1rem; color: #888; margin-bottom: 3rem; letter-spacing: 0.04em; }

    .cards { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }

    .card {
      position: relative;
      width: 260px; height: 140px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; color: #ccc;
      background: rgba(15, 15, 20, 0.6);
      transition: color 0.2s;
      cursor: pointer;
    }
    .card:hover { color: #FFD700; }

    /* Corner marks */
    .card::before, .card::after {
      content: ''; position: absolute;
      width: 20px; height: 20px;
      border-color: #555; border-style: solid;
      transition: border-color 0.2s, width 0.2s, height 0.2s;
    }
    .card::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .card::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
    .card:hover::before, .card:hover::after { border-color: #FFD700; width: 28px; height: 28px; }

    .card-title { font-weight: 400; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .card-sub { font-weight: 300; font-size: 0.75rem; color: #666; transition: color 0.2s; }
    .card:hover .card-sub { color: #998a00; }

    .socials { margin-top: 3rem; display: flex; gap: 1.5rem; }
    .socials a { color: #555; text-decoration: none; font-size: 0.8rem; font-weight: 300; transition: color 0.2s; }
    .socials a:hover { color: #FFD700; }

    .note { margin-top: 1.5rem; font-size: 0.7rem; color: #444; }
  </style>
</head>
<body>
  <h1>Farid Saud</h1>
  <p class="tagline">Data Scientist | ML Engineer | AI Engineer</p>

  <div class="cards">
    <a class="card" href="/handcv/">
      <span class="card-title">Gesture Mode</span>
      <span class="card-sub">hand tracking · webcam</span>
    </a>
    <a class="card" href="/resume/">
      <span class="card-title">Traditional</span>
      <span class="card-sub">classic format</span>
    </a>
  </div>

  <div class="socials">
    <a href="https://github.com/fsaudm">github</a>
    <a href="https://linkedin.com/in/faridsaud">linkedin</a>
    <a href="mailto:gfs3@illinois.edu">email</a>
  </div>

  <p class="note">gesture mode requires a webcam and desktop browser</p>
</body>
</html>

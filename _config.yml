about_profile_image: profile.jpg
about_content: |
  I am a Data Scientist & Infrastructure/Services Unit Manager at the [Data Science Research Services (DSRS)](https://dsrs.illinois.edu/about/unit/team) unit at the GIES College of Business, University of Illinois at Urbana-Champaign. I specialize in <mark>Data Science</mark>, <mark>Machine Learning</mark>, <mark>Deep Learning</mark>, and <mark>AI/LLM Engineering</mark>.

  At DSRS, I partner with faculty and research stakeholders to deliver datasets, models, and reproducible outputs. I lead the deployment of self-hosted AI services (LLM/VLM, embeddings, text-to-speech, image generation) on A100/H100 GPUs, manage infrastructure via Kubernetes, and mentor interns across Infrastructure and Services. I also lead internal tools like our Knowledge Base (RAG), semantic caching, and AI-powered paper highlighter.

  I hold two Master's degrees from UIUC - a M.S. in Statistics (Data Science concentration, GPA 4.0) and a M.S. in Data Science + Civil Engineering (GPA 4.0) - and a B.S. in Civil Engineering from Universidad San Francisco de Quito, Ecuador.

  Beyond work, I follow advancements in [AI](https://www.youtube.com/watch?v=fa8k8IQ1_X0), VR/AR, [fast cars](https://www.youtube.com/watch?v=nSqzp3kdAm4), drones, and [video games](https://www.youtube.com/watch?v=8fbtx0D2Wyk). I love traveling and exploring diverse cuisines.

more_title: "A Little More About Me"
more_content: |
  - I recently achieved a 1-year streak on Duolingo for practicing Italian, Arabic, and Korean!
  - So far, I have traveled to [18 countries](https://visitedplaces.com/view/?map=world&projection=geoNaturalEarth1&theme=dark-blue&water=1&graticule=0&names=1&duration=2000&placeduration=100&slider=0&autoplay=0&autozoom=none&autostep=0&home=US&places=~US.daaa44_MX_PR_CO_EC.73aa64_PE_BR_AR_UY_ES_FR_NL_DE_CH_IT_AT_SE_DK) and 24 states in the US.
  - I cannot recommend enough [Kurzgesagt](https://www.youtube.com/@kurzgesagt), [StatQuest](https://www.youtube.com/@statquest), and [Brilliant](https://brilliant.org/). Andrej Karpathy's [series](https://karpathy.ai/) are amazing, and I am very excited about [Eureka Labs](https://eurekalabs.ai/)!

